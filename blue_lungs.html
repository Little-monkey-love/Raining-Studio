<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Lung Animation</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #111;
  }

  .lung {
    width: 100px;
    height: 150px;
    background: linear-gradient(135deg, #00aaff, #0066cc);
    border-radius: 70% / 70%;
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.3, 1.1); /* expand width more than height */
    }
  }
</style>
</head>
<body>
  <div class="lung"></div>
</body>
</html>
